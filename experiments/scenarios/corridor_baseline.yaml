# Signalised urban corridor, baseline: three independently-timed fixed
# signals (all sharing offset 0 -- i.e. no coordination between them).
name: corridor_baseline
topology: corridor
seed: 0
dt: 0.5
duration: 1800

demand:
  mainline_veh_per_hour: 1000

idm:
  v0_kmh: 50
  T: 1.5
  a_max: 1.4
  b: 2.0
  delta: 4.0
  s0: 2.0

corridor:
  length: 1800
  base_speed_limit_kmh: 50
  green_wave: false
  signals:
    - {position: 500, cycle_time: 60, green_time: 25}
    - {position: 1100, cycle_time: 60, green_time: 25}
    - {position: 1600, cycle_time: 60, green_time: 25}
